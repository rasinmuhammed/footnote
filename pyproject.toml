[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footnote"
version = "0.1.0"
description = "Search-grounded answers where every claim carries a footnote, and every footnote is checked."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muhammed Rasin O M" }]
dependencies = ["serpapi>=1.0", "groq>=0.11", "python-dotenv>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
footnote = "footnote.cli:main"

[tool.setuptools.packages.find]
include = ["footnote*"]
